      storage: coral.storage.outbox.facil
      notifications:
        inbox: coral.notificaciones.inbox
        ready: coral.notificaciones.ready

  url:
    frontend: http://localhost:4200
    password-reset: http://localhost:4200/acceso/confirm-reset
    portal-socios: https://coralpagos.com.mx/PortalSocios/socios

  clients:
    storage:
      url: http://localhost:8081
      api-key: FACIL_4dkQZoLmzOZ2Ynob6GnIeYbPR3O0yyEq
      alias: MINIO_MAIN

    checkout:
      url: http://localhost:8083
      api-key: FACIL_4dkQZoLmzOZ2Ynob6GnIeYbPR3O0yyEq
      urls:
        portal-resv:
          redirect-success: http://localhost:4200/pago/success
          redirect-failure: http://localhost:4200/pago/error
          redirect-cancel: http://localhost:4200/
      is-sandbox: true
      default-tipo-serie-recibo: 1235

    notifications:
      url: http://localhost:8082
      api-key: FACIL_4dkQZoLmzOZ2Ynob6GnIeYbPR3O0yyEq
      alias: SMTP_GENERAL
      templates:
        reset-password: reset-pass-v1
        reserva-creada: reserva-creada-v1
        reserva-cancelada: reserva-cancelada-v1

    gotenberg:
      url: http://localhost:3000

    files-analysis:
      provider: local
      bedrock:
        region: ${AWS_REGION:us-east-1}
        model-id: ${BEDROCK_MODEL_ID:us.amazon.nova-pro-v1:0}
        temperature: 0.0
        max-tokens: 2048
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}

  security:
    password-reset:
      expiration-minutes: 60
    cors:
      allowed-origins: "http://localhost:4200,http://localhost:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

  banco:
    cie:
      bbva: 2072866

  crm:
