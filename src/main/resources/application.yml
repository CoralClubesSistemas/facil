spring:
  application:
    name: facil

  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  datasource-replica:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: replica-pool

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none

# ==============================
# LOGGING
# ==============================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) [%15.15thread] %clr(%-40.40logger{39}){cyan} : %msg%n"

server:
  max-http-request-header-size: 32KB

kind: Application