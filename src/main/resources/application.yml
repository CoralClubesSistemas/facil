spring:
  application:
    name: facil

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  datasource-replica:
    url: ${DB_REPLICA_URL:${DB_URL}}
    username: ${DB_REPLICA_USER:${DB_USER}}
    password: ${DB_REPLICA_PASS:${DB_PASS}}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: replica-pool

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

# ==============================
# CONFIGURACIÓN APP
# ==============================
app:
  clients:
    storage:
      url: ${STORAGE_SERVICE_URL}
      api-key: ${STORAGE_API_KEY}
      aliases:
        default: ${APP_CLIENTS_STORAGE_ALIASES_DEFAULT:MINIO_MAIN}

    notifications:
      url: ${NOTIFICATIONS_SERVICE_URL}
      api-key: ${NOTIFICATIONS_API_KEY}
      system-code: FACIL
      aliases:
        default: ${APP_CLIENTS_NOTIFICATIONS_ALIASES_DEFAULT:SMTP_GENERAL}
        aws-ses: ${APP_CLIENTS_NOTIFICATIONS_ALIASES_AWS_SES:AWS_SES}
      templates:
        reset-password: ${APP_CLIENTS_NOTIFICATIONS_TEMPLATES_RESET_PASSWORD:reset-pass-v1}
        reserva-creada: ${APP_CLIENTS_NOTIFICATIONS_TEMPLATES_RESERVA_CREADA:reserva-creada-v1}
        reserva-cancelada: ${APP_CLIENTS_NOTIFICATIONS_TEMPLATES_RESERVA_CANCELADA:reserva-cancelada-v1}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  url:
    frontend: ${FRONTEND_URL}
    password-reset: ${PASSWORD_RESET_URL}

# ==============================
# JWT
# ==============================
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 86400000

# ==============================
# LOGGING
# ==============================
logging:
  pattern:
    level: "%5p [${spring.application.name:}]"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

# ==================================================================
# PERFIL QA
# ==================================================================
---
spring:
  config:
    activate:
      on-profile: qa

# QA usa 100% variables de entorno → no hardcode
app:
  clients:
    storage:
      url: ${STORAGE_SERVICE_URL}
      api-key: ${STORAGE_API_KEY}
      aliases:
        default: ${APP_CLIENTS_STORAGE_ALIASES_DEFAULT:MINIO_MAIN}

    notifications:
      url: ${NOTIFICATIONS_SERVICE_URL}
      api-key: ${NOTIFICATIONS_API_KEY}
      system-code: FACIL
      aliases:
        default: ${APP_CLIENTS_NOTIFICATIONS_ALIASES_DEFAULT:SMTP_GENERAL}
        aws-ses: ${APP_CLIENTS_NOTIFICATIONS_ALIASES_AWS_SES:AWS_SES}

